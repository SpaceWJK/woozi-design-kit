<!doctype html>
<!-- macro-demo: catalogue | 골격: 카탈로그 | design: macrostructure=catalogue preset=neutral-editorial | gate: WCAG ✓ AI-tell ✓ token ✓ | score: Philosophy4 Hierarchy4 Execution5 Specificity5 Restraint4 Variety4 -->
<!-- design 근거: 동일 라인의 변주를 grid-template-columns 고정 비율(3→2→1) 균일 그리드로 나열하는 "시각적 인벤토리" 정의를 그대로 구현. flex 시행착오 없이 카드 정렬 100% 일관 유지. 재고/필터/정렬까지 갖춰 실서비스 카탈로그의 밀도를 재현. -->
<html lang="ko">
<head>
<meta charset="utf-8">
<title>오프컷 — 모노 데스크 시리즈</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="macrostructure=catalogue 골격 데모 · 균일 그리드 인벤토리 인덱스 구조">
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;overflow-x:hidden;max-width:100%}
:root{--paper:#faf9f6;--paper-2:#f1efe9;--ink:#141414;--ink-soft:#3a3a3a;--mute:#5f5f5f;--line:#e0dcd3;--accent:#35507a;--accent-2:#a8563a;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --shadow-rgb:20,20,20;--paper-rgb:250,249,246;--accent-tint:#eef1f6;--on-dark:#fff;--badge-low:#b03a2e;
  --ph-on-dark:rgba(255,255,255,.55);--stripe-tint:rgba(0,0,0,.05);
  --swatch-1a:#e3ddd0;--swatch-1b:#cfc6b2;--swatch-1c:#b9ae95;
  --swatch-2a:#3c3c3c;--swatch-2b:#232323;
  --swatch-3a:#efece5;--swatch-3b:#d9d3c4;--swatch-3c:#c3bba6}
body{font-family:var(--font);
  color:var(--ink);background:var(--paper);word-break:keep-all;line-height:1.6;padding-bottom:46px}
a{color:inherit;text-decoration:none}
a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1220px;margin:0 auto;padding:0 28px}

.topbar{border-bottom:1px solid var(--line);padding:20px 0}
.topbar .row{display:flex;justify-content:space-between;align-items:center}
.topbar .brand{font-weight:700;font-size:15px;letter-spacing:-.01em}
.topbar nav{display:flex;gap:22px;font-size:13px;color:var(--mute)}

.hero-band{padding:56px 0 40px;border-bottom:1px solid var(--line)}
.hero-band h1{font-size:clamp(26px,3.4vw,38px);margin:0 0 12px;letter-spacing:-.01em}
.hero-band p{color:var(--mute);font-size:14px;max-width:56ch;margin:0}

.bar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px;padding:24px 0}
.filters{display:flex;gap:10px;flex-wrap:wrap}
.chip{border:1px solid var(--line);border-radius:999px;padding:8px 16px;font-size:13px;color:var(--mute);
  background:var(--paper);cursor:pointer;transition:border-color .15s,color .15s}
.chip:hover{border-color:var(--ink-soft);color:var(--ink)}
.chip.on{border-color:var(--accent);color:var(--accent);font-weight:700;background:var(--accent-tint)}
.sort{font-size:13px;color:var(--mute);display:flex;align-items:center;gap:8px}
.sort select{border:1px solid var(--line);border-radius:6px;padding:7px 10px;font-size:13px;color:var(--ink);background:var(--paper)}

.count{font-size:12.5px;color:var(--mute);padding-bottom:18px}

.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;padding-bottom:96px}
.item{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--paper);transition:box-shadow .15s,border-color .15s}
.item:hover{border-color:var(--ink-soft);box-shadow:0 8px 24px rgba(var(--shadow-rgb),.06)}
.thumb{aspect-ratio:4/3;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
.thumb-1{background:linear-gradient(135deg,var(--swatch-1a) 0%,var(--swatch-1b) 55%,var(--swatch-1c) 100%)}
.thumb-2{background:linear-gradient(135deg,var(--swatch-2a) 0%,var(--swatch-2b) 55%,var(--ink) 100%)}
.thumb-3{background:linear-gradient(135deg,var(--swatch-3a) 0%,var(--swatch-3b) 55%,var(--swatch-3c) 100%)}
.thumb::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,var(--stripe-tint) 0 2px,transparent 2px 26px)}
.thumb .badge{position:absolute;top:10px;left:10px;font-size:10.5px;font-weight:700;letter-spacing:.03em;z-index:1;
  background:var(--ink);color:var(--on-dark);padding:4px 9px;border-radius:4px}
.thumb .badge.new{background:var(--accent-2)}
.thumb .badge.low{background:var(--badge-low)}
.thumb .ph{position:relative;z-index:1;font-size:11px;color:var(--ph-on-dark);letter-spacing:.06em;font-weight:700}
.thumb-1 .ph,.thumb-3 .ph{color:rgba(var(--shadow-rgb),.32)}

.body{padding:18px 18px 20px}
.body .cat{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px}
.body .nm{font-size:15.5px;font-weight:700;margin-bottom:6px}
.body .desc{font-size:12.5px;color:var(--mute);margin-bottom:14px;min-height:34px}
.body .row{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:12px}
.body .price{font-size:14.5px;font-weight:700}
.body .price small{font-size:11px;color:var(--mute);font-weight:400}
.body .more{font-size:12px;color:var(--accent);font-weight:700}
.item:hover .more{color:var(--accent-2)}

.foot-note{text-align:center;color:var(--mute);font-size:12.5px;padding-bottom:80px}

@media(max-width:960px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.grid{grid-template-columns:1fr}.bar{flex-direction:column;align-items:flex-start}}

.demo-bar{position:fixed;left:0;right:0;bottom:0;z-index:999;background:rgba(var(--paper-rgb),.94);
  backdrop-filter:blur(4px);border-top:1px solid var(--line);padding:9px 16px;font-size:11px;color:var(--mute);
  text-align:center;font-family:var(--mono);letter-spacing:.02em}
.demo-bar code{color:var(--accent-2);font-weight:600}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="topbar">
  <div class="wrap row">
    <span class="brand">OFFCUT 오프컷</span>
    <nav><a href="#">데스크</a><a href="#">체어</a><a href="#">수납</a><a href="#">쇼룸</a></nav>
  </div>
</div>

<div class="hero-band wrap">
  <h1 class="skin-heading">모노 데스크 시리즈</h1>
  <p>같은 도면에서 나온 마감·사이즈 변주 9종 — 전 항목 동일 조도의 스튜디오에서 촬영했습니다.</p>
</div>

<div class="wrap">
  <div class="bar">
    <div class="filters">
      <span class="chip on">전체 9</span>
      <span class="chip">오크 3</span>
      <span class="chip">월넛 3</span>
      <span class="chip">화이트 3</span>
      <span class="chip">스탠딩 3</span>
    </div>
    <div class="sort">정렬 <select><option>추천순</option><option>낮은 가격순</option><option>신상품순</option></select></div>
  </div>
  <!-- mockup: 데모용 플레이스홀더 수치 -->
  <div class="count">9개 항목 표시 중 · 재고 있음 7 · 품절임박 2</div>

  <div class="grid" id="grid"></div>
  <div class="foot-note">모든 가격은 부가세 포함, 배송비 별도 (데모용 더미 가격)</div>
</div>

<div class="demo-bar">카탈로그 골격 데모 · <code>/taste --macro=catalogue</code></div>

<script>
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const items=[
  {cat:'오크 · 스탠다드',nm:'모노 데스크 120',desc:'폭 120cm · 오크 원목 상판 · 무게 28kg',price:'428,000',badge:'NEW',thumb:1},
  {cat:'월넛 · 스탠다드',nm:'모노 데스크 120W',desc:'폭 120cm · 월넛 원목 상판 · 무게 31kg',price:'458,000',thumb:2},
  {cat:'화이트 · 컴팩트',nm:'모노 데스크 100',desc:'폭 100cm · 화이트 러버우드 · 무게 22kg',price:'368,000',thumb:3},
  {cat:'오크 · 스탠딩',nm:'모노 스탠딩 120',desc:'전동 승강 65-125cm · 오크 상판',price:'742,000',badge:'NEW',thumb:1},
  {cat:'월넛 · 컴팩트',nm:'모노 데스크 100W',desc:'폭 100cm · 월넛 상판 · 무게 24kg',price:'398,000',badge:'품절임박',thumb:2},
  {cat:'화이트 · 라지',nm:'모노 데스크 140',desc:'폭 140cm · 화이트 상판 · 무게 33kg',price:'452,000',thumb:3},
  {cat:'오크 · 라지',nm:'모노 데스크 140O',desc:'폭 140cm · 오크 원목 · 무게 36kg',price:'498,000',thumb:1},
  {cat:'월넛 · 스탠딩',nm:'모노 스탠딩 140',desc:'전동 승강 65-125cm · 월넛 상판',price:'788,000',badge:'품절임박',thumb:2},
  {cat:'화이트 · 스탠딩',nm:'모노 스탠딩 100',desc:'전동 승강 65-125cm · 컴팩트',price:'698,000',thumb:3}
];
document.getElementById('grid').innerHTML=items.map(it=>{
  const badgeCls = it.badge==='품절임박' ? 'low' : (it.badge ? 'new' : '');
  return `
  <article class="item skin-surface">
    <div class="thumb thumb-${it.thumb} skin-frame" data-skin-nopseudo>
      ${it.badge?`<span class="badge ${badgeCls} skin-badge">${esc(it.badge)}</span>`:''}
      <span class="ph">PRODUCT PHOTO</span>
    </div>
    <div class="body">
      <div class="cat">${esc(it.cat)}</div>
      <div class="nm">${esc(it.nm)}</div>
      <div class="desc">${esc(it.desc)}</div>
      <div class="row">
        <span class="price">₩${esc(it.price)}<small> 부터</small></span>
        <span class="more skin-cta">자세히 →</span>
      </div>
    </div>
  </article>`;
}).join('');
</script>
</body>
</html>
