<!-- macro-demo: portfolio-grid | 골격: 포트폴리오 그리드 | design: macrostructure=portfolio-grid preset=neutral-editorial+teal | gate: WCAG ✓ AI-tell ✓ token ✓ | score: Philosophy 4 Hierarchy 4 Execution 4 Specificity 4 Restraint 4 Variety 4 -->
<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>스튜디오 프레임 — Portfolio Grid 골격 데모</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root{
    --bg:#ffffff; --surface:#f3f5f4; --ink:#121613; --mute:#666e6b;
    --line:#e2e6e4; --accent:#0f766e; --accent-bright:#14b8a6; --accent-tint:#e3f4f1;
    --dark:#121613;
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
    --ease:cubic-bezier(.4,0,.2,1);
    --accent-ink:#fff; --ink-fg:#fff;
    --bg-rgb:255,255,255; --shadow-rgb:15,25,22;
    --band-fg:#eef4f2; --band-mute:#a9b3af;
    --band-cta-ink:#062622; --accent-bright-hover:#3fd0bd;
    --bar-fg:#d8ded9; --bar-line:#262b28;
    --icon-line:#b7c2be;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:var(--font);color:var(--ink);background:var(--bg);line-height:1.6;word-break:keep-all;overflow-x:hidden;font-size:15px}
  ::selection{background:var(--accent);color:var(--accent-ink)}
  :focus-visible{outline:2px solid var(--accent);outline-offset:3px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
  .wrap{max-width:1180px;margin:0 auto;padding:0 24px 120px}
  header.top{position:sticky;top:0;z-index:30;background:rgba(var(--bg-rgb),.92);backdrop-filter:blur(8px);padding:20px 24px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}
  header.top .wordmark{font-weight:800;font-size:15px}
  header.top .wordmark::before{content:'▣';color:var(--accent);margin-right:8px;font-size:12px}
  header.top .top-cta{font-size:12px;font-weight:700;color:var(--accent);text-decoration:none}
  header.top .top-cta:hover{text-decoration:underline}

  .intro{padding:60px 0 8px}
  .intro .eyebrow{font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:800}
  .intro h1{font-size:clamp(28px,4vw,42px);margin-top:14px;font-weight:800;letter-spacing:-.02em}
  .intro p{color:var(--mute);font-size:14.5px;margin-top:12px;max-width:56ch}

  .filters{display:flex;gap:8px;flex-wrap:wrap;padding:12px 0 32px;align-items:center}
  .fbtn{font-size:13px;padding:9px 18px;border:1px solid var(--line);background:var(--bg);border-radius:999px;cursor:pointer;color:var(--mute);font-family:inherit;min-height:38px;font-weight:600;transition:border-color .16s var(--ease),background .16s var(--ease),color .16s var(--ease)}
  .fbtn:hover{border-color:var(--ink);color:var(--ink)}
  .fbtn.on{background:var(--ink);color:var(--ink-fg);border-color:var(--ink)}
  .view-toggle{margin-left:auto;display:flex;gap:2px;border:1px solid var(--line);border-radius:8px;padding:2px}
  .vt-btn{font-size:12px;padding:6px 12px;border:none;background:none;cursor:pointer;color:var(--mute);border-radius:6px;font-family:inherit;min-height:30px}
  .vt-btn.on{background:var(--surface);color:var(--ink);font-weight:700}

  .grid{display:grid;grid-template-columns:repeat(1,1fr);gap:22px}
  @media(min-width:640px){.grid{grid-template-columns:repeat(2,1fr)}}
  @media(min-width:1000px){.grid{grid-template-columns:repeat(3,1fr)}}

  .card{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--bg);display:flex;flex-direction:column;transition:transform .2s var(--ease),box-shadow .2s var(--ease),border-color .2s var(--ease)}
  .card:hover{transform:translateY(-4px);box-shadow:0 16px 32px -16px rgba(var(--shadow-rgb),.18);border-color:var(--accent)}
  .card.hide{display:none}
  .thumb{aspect-ratio:4/3;background:var(--surface);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
  .thumb svg{width:52%;height:52%;transition:transform .3s var(--ease)}
  .card:hover .thumb svg{transform:scale(1.06)}
  .thumb .featured-tag{position:absolute;top:12px;left:12px;font-size:10px;font-weight:800;background:var(--accent);color:var(--accent-ink);padding:4px 10px;border-radius:999px;letter-spacing:.03em}
  .card-body{padding:18px 20px 20px;display:flex;flex-direction:column;gap:6px}
  .card-cat{font-size:11px;color:var(--accent);font-weight:800;letter-spacing:.05em;text-transform:uppercase}
  .card-title{font-size:16px;font-weight:800;letter-spacing:-.005em}
  .card-desc{font-size:12.5px;color:var(--mute)}
  .card-foot{display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
  .card-year{font-size:11px;color:var(--mute);font-variant-numeric:tabular-nums}
  .card-arrow{font-size:13px;color:var(--accent);opacity:0;transform:translateX(-4px);transition:opacity .2s var(--ease),transform .2s var(--ease)}
  .card:hover .card-arrow{opacity:1;transform:translateX(0)}

  .cta-band{margin-top:56px;background:var(--ink);color:var(--band-fg);border-radius:16px;padding:44px 32px;text-align:center}
  .cta-band h2{font-size:clamp(20px,2.6vw,28px);font-weight:800;margin-bottom:10px}
  .cta-band p{color:var(--band-mute);font-size:13.5px;margin-bottom:20px}
  .cta-band a{background:var(--accent-bright);color:var(--band-cta-ink);font-weight:800;font-size:13px;padding:12px 24px;border-radius:999px;text-decoration:none;transition:background .18s var(--ease)}
  .cta-band a:hover{background:var(--accent-bright-hover)}

  footer.site-foot{padding:44px 0 100px;text-align:center}
  footer.site-foot p{font-size:12px;color:var(--mute)}
  .demo-bar{position:fixed;left:0;right:0;bottom:0;background:var(--dark);color:var(--bar-fg);font-size:11px;letter-spacing:.04em;padding:9px 16px;text-align:center;z-index:50;border-top:1px solid var(--bar-line)}
  .demo-bar code{color:var(--accent-bright)}
</style>
</head>
<body>

<header class="top"><div class="wordmark">STUDIO FRAME</div><a class="top-cta" href="#">작업 의뢰하기 →</a></header>

<main class="wrap">
  <section class="intro">
    <div class="eyebrow">SELECTED WORK</div>
    <h1 class="skin-heading">작업이 곧 소개입니다</h1>
    <p>지난 5년간 작업한 24건 중 12건을 정리했습니다. 카테고리로 걸러 보거나, 최신순으로 훑어보세요.</p>
  </section>

  <div class="filters" id="filters" role="group" aria-label="카테고리 필터">
    <button class="fbtn on skin-cta" data-cat="all">전체 <!-- mockup: 데모용 플레이스홀더 수치 -->(12)</button>
    <button class="fbtn skin-cta" data-cat="brand">브랜딩 (4)</button>
    <button class="fbtn skin-cta" data-cat="web">웹 (4)</button>
    <button class="fbtn skin-cta" data-cat="package">패키지 (2)</button>
    <button class="fbtn skin-cta" data-cat="space">공간 (2)</button>
    <div class="view-toggle" role="group" aria-label="보기 방식"><button class="vt-btn on skin-cta">격자</button><button class="vt-btn skin-cta">목록</button></div>
  </div>

  <div class="grid" id="grid"></div>

  <div class="cta-band">
    <h2>다음 작업, 프레임과 함께</h2>
    <p>포트폴리오에 없는 카테고리도 상담 가능합니다.</p>
    <a class="skin-cta" href="#">프로젝트 문의하기</a>
  </div>
</main>

<footer class="site-foot"><p>© 2026 STUDIO FRAME — 이 페이지는 macrostructure 데모용으로 제작된 가상 포트폴리오입니다.</p></footer>

<div class="demo-bar">포트폴리오 그리드 골격 데모 · <code>/taste --macro=portfolio-grid</code></div>

<script>
(function(){
  var items=[
    {cat:'brand',name:'노트리버',desc:'협업 노트 리브랜딩',year:'2026',shape:'rect',featured:true},
    {cat:'web',name:'뭉치스토어',desc:'커머스 리디자인',year:'2026',shape:'circle'},
    {cat:'package',name:'페이퍼레인',desc:'구독 패키지 시스템',year:'2025',shape:'tri'},
    {cat:'space',name:'라운드하우스',desc:'쇼룸 공간 사이니지',year:'2025',shape:'rect'},
    {cat:'brand',name:'오르카랩',desc:'테크 스타트업 CI',year:'2025',shape:'circle',featured:true},
    {cat:'web',name:'커넥트허브',desc:'내부 툴 대시보드',year:'2025',shape:'tri'},
    {cat:'brand',name:'모노가든',desc:'플랜테리어 브랜드',year:'2024',shape:'rect'},
    {cat:'web',name:'폴드노트',desc:'제품 랜딩 페이지',year:'2024',shape:'circle'},
    {cat:'package',name:'소보로상점',desc:'베이커리 패키지',year:'2024',shape:'tri'},
    {cat:'space',name:'그리드오피스',desc:'공유 오피스 아이덴티티',year:'2024',shape:'rect'},
    {cat:'brand',name:'래티스',desc:'금융 서비스 CI',year:'2023',shape:'circle'},
    {cat:'web',name:'메이커스마켓',desc:'마켓플레이스 홈',year:'2023',shape:'tri'}
  ];
  function icon(shape){
    if(shape==='circle') return '<circle cx="50" cy="50" r="34" style="fill:none;stroke:var(--icon-line)" stroke-width="2"/><circle cx="50" cy="50" r="4" style="fill:var(--accent)"/>';
    if(shape==='tri') return '<polygon points="50,18 82,82 18,82" style="fill:none;stroke:var(--icon-line)" stroke-width="2"/>';
    return '<rect x="20" y="20" width="60" height="60" style="fill:none;stroke:var(--icon-line)" stroke-width="2"/><rect x="34" y="34" width="14" height="14" style="fill:var(--accent)"/>';
  }
  var catName={brand:'브랜딩',web:'웹',package:'패키지',space:'공간'};
  var grid=document.getElementById('grid');
  grid.innerHTML=items.map(function(it){
    return '<div class="card skin-surface" data-cat="'+it.cat+'">'+
      '<div class="thumb skin-frame">'+(it.featured?'<span class="featured-tag skin-badge">FEATURED</span>':'')+'<svg viewBox="0 0 100 100" aria-hidden="true">'+icon(it.shape)+'</svg></div>'+
      '<div class="card-body">'+
        '<div class="card-cat skin-badge">'+catName[it.cat]+'</div>'+
        '<div class="card-title">'+it.name+'</div>'+
        '<div class="card-desc">'+it.desc+'</div>'+
        '<div class="card-foot"><span class="card-year">'+it.year+'</span><span class="card-arrow">자세히 →</span></div>'+
      '</div></div>';
  }).join('');

  var btns=document.querySelectorAll('.fbtn');
  var cards=document.querySelectorAll('.card');
  btns.forEach(function(b){
    b.addEventListener('click',function(){
      btns.forEach(function(x){x.classList.remove('on')});
      b.classList.add('on');
      var cat=b.getAttribute('data-cat');
      cards.forEach(function(c){
        c.classList.toggle('hide', cat!=='all' && c.getAttribute('data-cat')!==cat);
      });
    });
  });
})();
</script>
</body>
</html>
